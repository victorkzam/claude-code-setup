name: CI

# push covers every branch (including feature branches, per project convention
# of feature-branch-only work); pull_request targeting main covers PRs.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    name: shellcheck + jq + tests/run.sh all + plugin validate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq and shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck jq

      - name: shellcheck hooks + tests/run.sh
        run: shellcheck -x hooks/*.sh tests/run.sh

      - name: validate plugin/marketplace/hooks JSON
        run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json

      - name: tests/run.sh all
        run: bash tests/run.sh all

      - name: categorical prompt-hygiene greps
        # Red until T3-T6 rewrite skills/agents/rules; CI only runs at push
        # time, which happens after T7 (accepted by the design).
        run: |
          set -e
          if git grep -niE 'opus needs|do not trust|be decisive|read all files fresh|claude-design-active|claude-orchestrator-active' -- skills agents rules; then
            echo "gate: banned coordination phrases in prompts"
            exit 1
          fi
          if git grep -nwE 'NEVER|ALWAYS|MUST|CRITICAL' -- skills agents rules; then
            echo "gate: emphatic capitals in prompts"
            exit 1
          fi
          if git grep -niE 'under 50 lines' -- skills agents rules; then
            echo "gate: 'under 50 lines' phrase in prompts"
            exit 1
          fi
          if git grep -nE '^(disallowedTools|permissionMode|mcpServers|hooks):' -- agents; then
            echo "gate: disallowed frontmatter keys in agents"
            exit 1
          fi
          for f in agents/*.md; do
            for k in model tools effort maxTurns; do
              grep -q "^$k:" "$f" || { echo "$f lacks $k:"; exit 1; }
            done
          done
          if git grep -niE '~/.claude/plans|gitattributes|linguist|git clean' -- skills; then
            echo "gate: internal-path/meta references in skills"
            exit 1
          fi
          if ! grep -q haiku skills/design/SKILL.md; then
            echo "gate: skills/design/SKILL.md missing haiku reference"
            exit 1
          fi
          N=$(sed -n 's/^Copyright (c) [0-9]* //p' LICENSE | cut -d' ' -f1)
          if [ -z "$N" ]; then
            echo "gate: could not extract copyright name from LICENSE"
            exit 1
          fi
          if git grep -qi "$N" -- skills agents rules hooks tests WORKFLOW.md CLAUDE.md docs; then
            echo "gate: LICENSE-derived name leaked into prompts/docs"
            exit 1
          fi

      - name: install Claude Code CLI and validate plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

  macos:
    name: hooks under system bash 3.2 (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: tests/run.sh hooks under system /bin/bash (jq preinstalled)
        run: |
          echo "bash: $(command -v /bin/bash) ($(/bin/bash --version | head -n1))"
          /bin/bash tests/run.sh hooks
